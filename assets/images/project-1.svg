<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>

  <!-- soft glow -->
  <circle cx="200" cy="150" r="120" fill="#FBBF24" opacity="0.05"/>

  <!-- Left coin: Dollar -->
  <circle cx="140" cy="150" r="58" fill="#232333" stroke="#FBBF24" stroke-width="3"/>
  <text x="140" y="168" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#FBBF24" text-anchor="middle">$</text>

  <!-- Right coin: Real -->
  <circle cx="260" cy="150" r="58" fill="#232333" stroke="#FBBF24" stroke-width="3"/>
  <text x="260" y="163" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#FBBF24" text-anchor="middle">R$</text>

  <!-- Exchange arrows -->
  <path d="M 178 128 L 222 128" stroke="#F5F5F5" stroke-width="4" fill="none"/>
  <path d="M 212 118 L 222 128 L 212 138" stroke="#F5F5F5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 222 172 L 178 172" stroke="#F5F5F5" stroke-width="4" fill="none"/>
  <path d="M 188 162 L 178 172 L 188 182" stroke="#F5F5F5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- small orbiting dots for motion -->
  <circle cx="90" cy="90" r="4" fill="#FBBF24" opacity="0.6"/>
  <circle cx="310" cy="210" r="4" fill="#FBBF24" opacity="0.6"/>
  <circle cx="320" cy="90" r="3" fill="#F5F5F5" opacity="0.4"/>
  <circle cx="80" cy="215" r="3" fill="#F5F5F5" opacity="0.4"/>
</svg>
