<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>

  <!-- Stars -->
  <circle cx="60" cy="55" r="2" fill="#F5F5F5" opacity="0.7"/>
  <circle cx="330" cy="45" r="1.6" fill="#F5F5F5" opacity="0.6"/>
  <circle cx="250" cy="70" r="1.6" fill="#F5F5F5" opacity="0.5"/>
  <circle cx="110" cy="90" r="1.4" fill="#F5F5F5" opacity="0.5"/>
  <circle cx="360" cy="100" r="2" fill="#F5F5F5" opacity="0.6"/>

  <!-- Distant mountains -->
  <path d="M 0 190 L 70 120 L 140 190 Z" fill="#3a2b4d"/>
  <path d="M 110 190 L 190 100 L 270 190 Z" fill="#4a2f4e"/>
  <path d="M 240 190 L 320 130 L 400 190 Z" fill="#3a2b4d"/>

  <!-- Foreground mountains -->
  <path d="M -10 220 L 90 140 L 190 220 Z" fill="#5c2f4a"/>
  <path d="M 150 220 L 260 130 L 410 220 Z" fill="#6b3550"/>

  <!-- Ground -->
  <rect x="0" y="220" width="400" height="30" fill="#191921"/>

  <!-- Player ship -->
  <g transform="translate(200,205)">
    <path d="M 0 -14 L 12 10 L 0 4 L -12 10 Z" fill="#FBBF24"/>
    <path d="M 0 4 L 6 16 L 0 12 L -6 16 Z" fill="#e85d4a"/>
  </g>

  <!-- Enemy ships -->
  <g transform="translate(140,150) rotate(180)">
    <path d="M 0 -10 L 9 7 L 0 3 L -9 7 Z" fill="#8fbf5c"/>
  </g>
  <g transform="translate(270,165) rotate(180)">
    <path d="M 0 -8 L 7 6 L 0 2 L -7 6 Z" fill="#8fbf5c"/>
  </g>

  <!-- Laser -->
  <line x1="200" y1="190" x2="200" y2="175" stroke="#FBBF24" stroke-width="3"/>
</svg>
