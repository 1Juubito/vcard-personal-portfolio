<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>
  <circle cx="200" cy="150" r="120" fill="#FBBF24" opacity="0.05"/>

  <!-- Storefront awning -->
  <g>
    <path d="M 90 130 L 200 100 L 310 130 L 300 150 L 100 150 Z" fill="#FBBF24"/>
    <path d="M 100 150 L 300 150" stroke="#191921" stroke-width="0"/>
    <!-- awning stripes -->
    <path d="M 130 122 L 140 149 M 170 112 L 175 149 M 210 108 L 210 149 M 250 112 L 245 149 M 290 122 L 280 149"
          stroke="#191921" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- Store body -->
  <rect x="105" y="150" width="190" height="90" fill="#232333" stroke="#3a3a4d" stroke-width="2"/>

  <!-- Window -->
  <rect x="120" y="165" width="60" height="45" rx="4" fill="#191921" stroke="#FBBF24" stroke-width="2"/>
  <!-- Door -->
  <rect x="220" y="175" width="45" height="65" rx="3" fill="#191921" stroke="#FBBF24" stroke-width="2"/>
  <circle cx="255" cy="207" r="2.5" fill="#FBBF24"/>

  <!-- Fruit basket in window -->
  <circle cx="135" cy="188" r="8" fill="#e85d4a"/>
  <circle cx="150" cy="192" r="8" fill="#f2b134"/>
  <circle cx="163" cy="186" r="7" fill="#8fbf5c"/>

  <!-- Ground line -->
  <line x1="70" y1="240" x2="330" y2="240" stroke="#3a3a4d" stroke-width="3"/>
</svg>
