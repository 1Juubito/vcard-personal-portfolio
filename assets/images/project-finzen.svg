<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>
  <circle cx="200" cy="150" r="120" fill="#FBBF24" opacity="0.05"/>

  <!-- Phone frame -->
  <rect x="148" y="50" width="104" height="200" rx="18" fill="#232333" stroke="#3a3a4d" stroke-width="2.5"/>
  <rect x="158" y="68" width="84" height="163" rx="5" fill="#191921"/>
  <!-- Notch -->
  <rect x="183" y="55" width="34" height="8" rx="4" fill="#191921"/>
  <!-- Home bar -->
  <rect x="180" y="238" width="40" height="4" rx="2" fill="#3a3a4d"/>

  <!-- Screen content -->
  <!-- Header -->
  <rect x="163" y="74" width="74" height="18" rx="3" fill="#1e1e2e"/>
  <text x="200" y="86" font-family="Arial, sans-serif" font-size="7" fill="#FBBF24" text-anchor="middle" font-weight="bold">FinZen</text>

  <!-- Balance card -->
  <rect x="163" y="97" width="74" height="30" rx="5" fill="#2a2a3d"/>
  <text x="200" y="107" font-family="Arial, sans-serif" font-size="5" fill="#aaa" text-anchor="middle">Saldo disponível</text>
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="9" fill="#8fbf5c" text-anchor="middle" font-weight="bold">R$ 4.280,00</text>

  <!-- Mini bar chart -->
  <rect x="168" y="171" width="9" height="20" rx="2" fill="#FBBF24" opacity="0.7"/>
  <rect x="181" y="160" width="9" height="31" rx="2" fill="#FBBF24"/>
  <rect x="194" y="168" width="9" height="23" rx="2" fill="#FBBF24" opacity="0.7"/>
  <rect x="207" y="153" width="9" height="38" rx="2" fill="#8fbf5c"/>
  <rect x="220" y="163" width="9" height="28" rx="2" fill="#FBBF24" opacity="0.8"/>

  <!-- Fingerprint icon (biometric) -->
  <g transform="translate(314,210)">
    <circle cx="0" cy="0" r="24" fill="#232333" stroke="#FBBF24" stroke-width="2"/>
    <!-- simplified fingerprint arcs -->
    <path d="M-10,0 Q-10,-10 0,-10 Q10,-10 10,0" stroke="#FBBF24" stroke-width="2" fill="none"/>
    <path d="M-14,4 Q-14,-14 0,-14 Q14,-14 14,4" stroke="#FBBF24" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M-6,6 Q-6,-6 0,-6 Q6,-6 6,6" stroke="#FBBF24" stroke-width="2" fill="none"/>
    <line x1="0" y1="2" x2="0" y2="10" stroke="#FBBF24" stroke-width="2"/>
  </g>

  <!-- Kotlin badge -->
  <g transform="translate(80,80)">
    <rect x="-20" y="-14" width="40" height="28" rx="5" fill="#7F52FF" opacity="0.9"/>
    <text x="0" y="5" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Kotlin</text>
  </g>
</svg>
