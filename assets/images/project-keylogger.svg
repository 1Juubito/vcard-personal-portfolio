<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>
  <circle cx="200" cy="150" r="120" fill="#e85d4a" opacity="0.04"/>

  <!-- Android phone (left) -->
  <rect x="36" y="70" width="90" height="162" rx="14" fill="#232333" stroke="#e85d4a" stroke-width="2"/>
  <rect x="46" y="86" width="70" height="130" rx="4" fill="#191921"/>
  <circle cx="81" cy="80" r="3" fill="#191921"/>
  <rect x="65" y="228" width="32" height="3" rx="1.5" fill="#3a3a4d"/>

  <!-- Screen content: accessibility event capture -->
  <rect x="50" y="92" width="62" height="14" rx="3" fill="#1e1e2e"/>
  <text x="81" y="103" font-family="monospace" font-size="6" fill="#e85d4a" text-anchor="middle">Acessibilidade ON</text>

  <!-- Keyboard rows on screen (being captured) -->
  <rect x="51" y="112" width="12" height="10" rx="2" fill="#2a2a3d"/>
  <rect x="66" y="112" width="12" height="10" rx="2" fill="#2a2a3d"/>
  <rect x="81" y="112" width="12" height="10" rx="2" fill="#2a2a3d"/>
  <rect x="96" y="112" width="12" height="10" rx="2" fill="#2a2a3d"/>
  <text x="57" y="120" font-family="monospace" font-size="6" fill="#aaa" text-anchor="middle">Q</text>
  <text x="72" y="120" font-family="monospace" font-size="6" fill="#aaa" text-anchor="middle">W</text>
  <text x="87" y="120" font-family="monospace" font-size="6" fill="#FBBF24" text-anchor="middle" font-weight="bold">E</text>
  <text x="102" y="120" font-family="monospace" font-size="6" fill="#aaa" text-anchor="middle">R</text>

  <!-- pulsing capture indicator -->
  <circle cx="87" cy="116" r="7" fill="none" stroke="#FBBF24" stroke-width="1.5" opacity="0.6"/>
  <circle cx="87" cy="116" r="11" fill="none" stroke="#FBBF24" stroke-width="1" opacity="0.3"/>

  <!-- Keystrokes being logged on screen -->
  <rect x="50" y="130" width="62" height="50" rx="3" fill="#0d0d15"/>
  <text x="55" y="142" font-family="monospace" font-size="6" fill="#8fbf5c">senha123</text>
  <text x="55" y="153" font-family="monospace" font-size="6" fill="#8fbf5c">user@email.com</text>
  <text x="55" y="164" font-family="monospace" font-size="6" fill="#aaa">cartao1234</text>
  <text x="55" y="175" font-family="monospace" font-size="6" fill="#aaa" opacity="0.6">_</text>

  <!-- TCP arrow with lightning -->
  <line x1="127" y1="152" x2="195" y2="152" stroke="#e85d4a" stroke-width="2.5" stroke-dasharray="8 4"/>
  <polygon points="191,147 200,152 191,157" fill="#e85d4a"/>
  <text x="161" y="144" font-family="monospace" font-size="6.5" fill="#e85d4a" text-anchor="middle">TCP</text>

  <!-- C2 server box (right) -->
  <rect x="200" y="100" width="158" height="105" rx="8" fill="#232333" stroke="#FBBF24" stroke-width="2"/>
  <text x="279" y="120" font-family="monospace" font-size="7.5" fill="#FBBF24" text-anchor="middle" font-weight="bold">C2 — Oracle Cloud</text>
  <text x="279" y="133" font-family="monospace" font-size="6.5" fill="#aaa" text-anchor="middle">recebimento.py</text>

  <!-- log output -->
  <rect x="210" y="140" width="138" height="55" rx="4" fill="#0d0d15"/>
  <text x="216" y="152" font-family="monospace" font-size="5.8" fill="#8fbf5c">[14:32:01] Pixel 7 (API:34)</text>
  <text x="216" y="163" font-family="monospace" font-size="5.8" fill="#FBBF24">[14:32:15] senha123</text>
  <text x="216" y="174" font-family="monospace" font-size="5.8" fill="#FBBF24">[14:32:22] user@email.com</text>
  <text x="216" y="185" font-family="monospace" font-size="5.8" fill="#aaa">[14:32:28] cartao1234_</text>

  <!-- MAUI badge -->
  <rect x="200" y="222" width="82" height="26" rx="5" fill="#5C2D91" opacity="0.9"/>
  <text x="241" y="238" font-family="Arial, sans-serif" font-size="8.5" fill="white" text-anchor="middle" font-weight="bold">.NET MAUI</text>

  <!-- Android badge -->
  <rect x="290" y="222" width="68" height="26" rx="5" fill="#3ddc84" opacity="0.9"/>
  <text x="324" y="238" font-family="Arial, sans-serif" font-size="8.5" fill="#000" text-anchor="middle" font-weight="bold">Android</text>

  <!-- MITRE tag bottom left -->
  <rect x="36" y="247" width="90" height="20" rx="4" fill="#0d0d15" stroke="#e85d4a" stroke-width="1"/>
  <text x="81" y="261" font-family="monospace" font-size="6" fill="#e85d4a" text-anchor="middle">T1417 · T1626 · T1041</text>
</svg>
