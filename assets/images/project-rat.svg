<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>

  <!-- Grid background subtle -->
  <line x1="0" y1="75" x2="400" y2="75" stroke="#2a2a3d" stroke-width="1"/>
  <line x1="0" y1="150" x2="400" y2="150" stroke="#2a2a3d" stroke-width="1"/>
  <line x1="0" y1="225" x2="400" y2="225" stroke="#2a2a3d" stroke-width="1"/>
  <line x1="100" y1="0" x2="100" y2="300" stroke="#2a2a3d" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="300" stroke="#2a2a3d" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="300" stroke="#2a2a3d" stroke-width="1"/>

  <!-- Implant box (left) -->
  <rect x="28" y="110" width="110" height="80" rx="8" fill="#232333" stroke="#e85d4a" stroke-width="2"/>
  <text x="83" y="135" font-family="monospace" font-size="8" fill="#e85d4a" text-anchor="middle" font-weight="bold">IMPLANT</text>
  <text x="83" y="149" font-family="monospace" font-size="7" fill="#aaa" text-anchor="middle">WindowsUpdate.exe</text>
  <text x="83" y="162" font-family="monospace" font-size="6.5" fill="#666" text-anchor="middle">C# · .NET 10</text>
  <text x="83" y="174" font-family="monospace" font-size="6.5" fill="#666" text-anchor="middle">Windows</text>

  <!-- Listener box (right) -->
  <rect x="262" y="110" width="110" height="80" rx="8" fill="#232333" stroke="#FBBF24" stroke-width="2"/>
  <text x="317" y="135" font-family="monospace" font-size="8" fill="#FBBF24" text-anchor="middle" font-weight="bold">C2 LISTENER</text>
  <text x="317" y="149" font-family="monospace" font-size="7" fill="#aaa" text-anchor="middle">listener.py</text>
  <text x="317" y="162" font-family="monospace" font-size="6.5" fill="#666" text-anchor="middle">Python 3 · Oracle</text>
  <text x="317" y="174" font-family="monospace" font-size="6.5" fill="#666" text-anchor="middle">Ubuntu · IP Fixo</text>

  <!-- TCP arrows -->
  <line x1="138" y1="143" x2="262" y2="143" stroke="#FBBF24" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="258,139 265,143 258,147" fill="#FBBF24"/>

  <line x1="262" y1="158" x2="138" y2="158" stroke="#e85d4a" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="142,154 135,158 142,162" fill="#e85d4a"/>

  <!-- TCP label -->
  <rect x="164" y="136" width="72" height="14" rx="3" fill="#191921"/>
  <text x="200" y="147" font-family="monospace" font-size="6.5" fill="#8fbf5c" text-anchor="middle">TCP · cmds + data</text>

  <!-- Terminal prompt top -->
  <rect x="28" y="38" width="170" height="60" rx="6" fill="#0d0d15" stroke="#333" stroke-width="1"/>
  <text x="38" y="56" font-family="monospace" font-size="7.5" fill="#8fbf5c">RAT&gt; cmd whoami</text>
  <text x="38" y="69" font-family="monospace" font-size="7.5" fill="#aaa">victim\john</text>
  <text x="38" y="82" font-family="monospace" font-size="7.5" fill="#8fbf5c">RAT&gt; download senhas.txt</text>

  <!-- MITRE badge -->
  <rect x="210" y="38" width="162" height="32" rx="6" fill="#0d0d15" stroke="#e85d4a" stroke-width="1.5"/>
  <text x="291" y="51" font-family="monospace" font-size="6.5" fill="#e85d4a" text-anchor="middle" font-weight="bold">MITRE ATT&amp;CK</text>
  <text x="291" y="63" font-family="monospace" font-size="6" fill="#aaa" text-anchor="middle">T1547 · T1082 · T1041</text>

  <!-- Operator box bottom right -->
  <rect x="262" y="210" width="110" height="52" rx="8" fill="#232333" stroke="#8fbf5c" stroke-width="1.5"/>
  <text x="317" y="228" font-family="monospace" font-size="7.5" fill="#8fbf5c" text-anchor="middle">OPERADOR</text>
  <text x="317" y="242" font-family="monospace" font-size="6.5" fill="#666" text-anchor="middle">Kali Linux</text>
  <text x="317" y="254" font-family="monospace" font-size="6.5" fill="#666" text-anchor="middle">SSH · Ed25519</text>

  <!-- SSH arrow -->
  <line x1="317" y1="210" x2="317" y2="192" stroke="#8fbf5c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="313,196 317,190 321,196" fill="#8fbf5c"/>
</svg>
