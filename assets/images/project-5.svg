<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>
  <circle cx="200" cy="150" r="120" fill="#FBBF24" opacity="0.05"/>

  <!-- Phone frame -->
  <rect x="155" y="60" width="90" height="180" rx="16" fill="#232333" stroke="#3a3a4d" stroke-width="3"/>
  <rect x="165" y="78" width="70" height="145" rx="4" fill="#191921"/>
  <circle cx="200" cy="232" r="4" fill="#3a3a4d"/>

  <!-- Balance bar on screen -->
  <rect x="173" y="90" width="54" height="16" rx="3" fill="#8fbf5c" opacity="0.85"/>
  <rect x="173" y="112" width="34" height="8" rx="2" fill="#F5F5F5" opacity="0.5"/>

  <!-- Mini bar chart -->
  <rect x="173" y="165" width="8" height="24" fill="#FBBF24"/>
  <rect x="186" y="150" width="8" height="39" fill="#FBBF24"/>
  <rect x="199" y="172" width="8" height="17" fill="#FBBF24"/>
  <rect x="212" y="158" width="8" height="31" fill="#FBBF24"/>

  <!-- Piggy bank floating beside phone -->
  <g transform="translate(268,150)">
    <ellipse cx="0" cy="0" rx="34" ry="26" fill="#e2a03f"/>
    <circle cx="24" cy="-4" r="8" fill="#e2a03f"/>
    <circle cx="27" cy="-6" r="2" fill="#191921"/>
    <rect x="-6" y="-24" width="12" height="6" rx="2" fill="#e2a03f"/>
    <ellipse cx="-26" cy="4" rx="5" ry="7" fill="#c9852c"/>
    <ellipse cx="18" cy="18" rx="5" ry="7" fill="#c9852c"/>
    <rect x="-10" y="-2" width="20" height="4" rx="2" fill="#191921" opacity="0.6"/>
  </g>

  <!-- Coin -->
  <circle cx="300" cy="90" r="10" fill="#FBBF24"/>
  <text x="300" y="94" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#191921" text-anchor="middle">R$</text>
</svg>
