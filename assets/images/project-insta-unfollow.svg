<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="400" height="300" rx="16" fill="#191921"/>
  <circle cx="200" cy="150" r="120" fill="#FBBF24" opacity="0.04"/>

  <!-- Instagram gradient ring -->
  <defs>
    <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f09433"/>
      <stop offset="25%" stop-color="#e6683c"/>
      <stop offset="50%" stop-color="#dc2743"/>
      <stop offset="75%" stop-color="#cc2366"/>
      <stop offset="100%" stop-color="#bc1888"/>
    </linearGradient>
  </defs>

  <!-- Left: You (avatar circle) -->
  <circle cx="108" cy="148" r="38" fill="#232333" stroke="url(#ig)" stroke-width="3"/>
  <circle cx="108" cy="136" r="14" fill="#3a3a4d"/>
  <path d="M78 175 Q78 158 108 158 Q138 158 138 175" fill="#3a3a4d"/>
  <text x="108" y="196" font-family="Arial, sans-serif" font-size="8" fill="#aaa" text-anchor="middle">@você</text>

  <!-- Right side: 3 people stacked -->
  <!-- Person 1 - following back (green check) -->
  <circle cx="292" cy="100" r="26" fill="#232333" stroke="#8fbf5c" stroke-width="2"/>
  <circle cx="292" cy="91" r="9" fill="#3a3a4d"/>
  <path d="M272 114 Q272 104 292 104 Q312 104 312 114" fill="#3a3a4d"/>
  <circle cx="310" cy="90" r="9" fill="#8fbf5c"/>
  <text x="314" y="94" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">✓</text>
  <text x="292" y="136" font-family="Arial, sans-serif" font-size="7" fill="#8fbf5c" text-anchor="middle">te segue</text>

  <!-- Person 2 - not following back (X mark) -->
  <circle cx="292" cy="186" r="26" fill="#232333" stroke="#e85d4a" stroke-width="2"/>
  <circle cx="292" cy="177" r="9" fill="#3a3a4d"/>
  <path d="M272 200 Q272 190 292 190 Q312 190 312 200" fill="#3a3a4d"/>
  <circle cx="310" cy="176" r="9" fill="#e85d4a"/>
  <text x="313" y="180" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">✕</text>
  <text x="292" y="222" font-family="Arial, sans-serif" font-size="7" fill="#e85d4a" text-anchor="middle">traíra 👀</text>

  <!-- Arrows from you to others -->
  <line x1="146" y1="135" x2="258" y2="100" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="5 3"/>
  <polygon points="254,95 261,100 253,105" fill="#FBBF24"/>

  <line x1="146" y1="160" x2="258" y2="183" stroke="#FBBF24" stroke-width="1.8" stroke-dasharray="5 3"/>
  <polygon points="254,178 262,183 255,188" fill="#FBBF24"/>

  <!-- Return arrow only from person 1 -->
  <path d="M 268 112 Q 200 128 148 148" stroke="#8fbf5c" stroke-width="2" fill="none"/>
  <polygon points="150,143 146,150 154,150" fill="#8fbf5c"/>

  <!-- Python badge bottom left -->
  <rect x="28" y="244" width="68" height="26" rx="5" fill="#3776AB" opacity="0.9"/>
  <text x="62" y="261" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">Python 3</text>

  <!-- "zero deps" badge -->
  <rect x="104" y="244" width="80" height="26" rx="5" fill="#232333" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="144" y="261" font-family="Arial, sans-serif" font-size="8" fill="#FBBF24" text-anchor="middle">zero deps</text>

  <!-- HTML report badge -->
  <rect x="192" y="244" width="72" height="26" rx="5" fill="#e34c26" opacity="0.9"/>
  <text x="228" y="261" font-family="Arial, sans-serif" font-size="9" fill="white" text-anchor="middle" font-weight="bold">HTML report</text>
</svg>
